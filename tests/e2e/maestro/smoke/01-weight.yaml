# Log a weight and see it in history (spec 27 #5).
appId: ${APP_ID}
---
- runFlow: _sign-in.yaml
- openLink: pace://weight/log
- tapOn: 'Weight'
- eraseText
- inputText: '99.5'
- hideKeyboard
- tapOn: 'Save'
- runFlow:
    when:
      visible: 'Is this correct?'
    commands:
      - tapOn: 'Save anyway'
- openLink: pace://progress/weight
# History is below the chart and stats; scroll on smaller screens
- scrollUntilVisible:
    element: '99.5.*'
