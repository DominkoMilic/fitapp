# Maestro flow for a real device / simulator with a development build connected to a
# Supabase project. Uses a fresh account each run (email confirmation must be completed
# manually or disabled in a test project).
#   maestro test tests/e2e/maestro/onboarding.yaml -e EMAIL=you+1@example.com -e PASSWORD=abcd1234
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: 'I already have an account'
- tapOn: 'Email'
- inputText: ${EMAIL}
- tapOn: 'Password'
- inputText: ${PASSWORD}
- tapOn: 'Sign in'
- assertVisible: 'About you'
- tapOn: 'Name'
- eraseText
- inputText: 'Dev'
# Date of birth from the calendar sheet: years → month → day
- tapOn: 'Date of birth:.*'
- tapOn: 'Earlier years'
- tapOn: '2003'
- tapOn: 'May 2003'
- tapOn: '1 May 2003.*'
- tapOn: 'Male'
- tapOn: 'Height'
- eraseText
- inputText: '187'
- hideKeyboard
- scrollUntilVisible:
    element: 'Current weight'
- tapOn: 'Current weight'
- eraseText
- inputText: '108'
- hideKeyboard
- scrollUntilVisible:
    element: 'Moderately active.*'
- tapOn: 'Moderately active.*'
- tapOn: 'Continue'
- tapOn: 'Lose weight.*'
- tapOn: 'Target weight'
- eraseText
- inputText: '90'
- hideKeyboard
- tapOn: 'Continue'
# Your week (schedule + equipment)
- scrollUntilVisible:
    element: 'Dumbbells'
- tapOn: 'Dumbbells'
- tapOn: 'Continue'
- tapOn: 'Skip for now'
- tapOn: 'I accept the terms of use'
- tapOn: 'I accept the privacy policy'
- tapOn: 'Continue'
- assertVisible: 'Your starting plan'
- assertVisible: 'Your goal'
- tapOn: 'Save and start'
# Home: progress and the quick actions are near the top (coach cards can push 'Today' down)
- extendedWaitUntil:
    visible: 'Log weight'
    timeout: 20000
